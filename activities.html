<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กิจกรรมโรงเรียน</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
transition:0.3s;
}

.dark{
background:#121212;
color:white;
}

.menu-btn{
font-size:28px;
padding:10px 15px;
background:#333;
color:white;
cursor:pointer;
position:fixed;
top:10px;
left:10px;
}

.dark-btn{
position:fixed;
top:10px;
right:15px;
padding:8px 14px;
border:none;
background:#333;
color:white;
cursor:pointer;
}

.sidebar{
position:fixed;
left:-250px;
top:0;
width:250px;
height:100%;
background:#222;
transition:0.3s;
padding-top:60px;
}

.sidebar a{
display:block;
padding:12px 20px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:#444;
}

.sidebar.show{
left:0;
}

.content{
padding:80px 20px;
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px auto;
width:80%;
border-radius:10px;
}

.dark .card{
background:#1e1e1e;
}

</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">☰</div>
<button class="dark-btn" onclick="toggleDark()">🌙</button>

<div id="menu" class="sidebar">

<a href="index.html">หน้าหลัก</a>
<a href="grades.html">คะแนน</a>
<a href="activity.html">กิจกรรม</a>
<a href="contact.html">ติดต่อ</a>

</div>

<div class="content">

<h2>กิจกรรมโรงเรียน</h2>

<div class="card">
<h3>กีฬาสี</h3>
<p>จัดขึ้นทุกปีเพื่อส่งเสริมความสามัคคี</p>
</div>

<div class="card">
<h3>กิจกรรมจิตอาสา</h3>
<p>ทำความสะอาดโรงเรียนและปลูกต้นไม้</p>
</div>

<div class="card">
<h3>แข่งขันวิชาการ</h3>
<p>นักเรียนเข้าร่วมแข่งขันระดับเขต</p>
</div>

</div>

<script>

function toggleMenu(){
document.getElementById("menu").classList.toggle("show")
}

function toggleDark(){
document.body.classList.toggle("dark")
}

</script>

</body>
</html>
