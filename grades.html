<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คะแนนนักเรียน</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div class="sidebar" id="menu">
  <a href="index.html">หน้าหลัก</a>
  <a href="activities.html">กิจกรรม</a>
  <a href="grades.html">คะแนน</a>
  <a href="contact.html">ติดต่อ</a>
</div>

<div class="container">

<div class="card">
<h3>ค้นหาชื่อนักเรียน</h3>
<input type="text" id="searchInput" onkeyup="searchStudent()" placeholder="พิมพ์ชื่อ...">
</div>

<script>
const container = document.currentScript.parentElement;

for(let grade=1; grade<=6; grade++){
  for(let room=1; room<=3; room++){

    let card = document.createElement("div");
    card.className="card";

    let title = document.createElement("h3");
    title.innerText = "มัธยมศึกษาปีที่ "+grade+"/"+room;
    card.appendChild(title);

    let table = document.createElement("table");

    table.innerHTML = `
      <thead>
        <tr>
          <th>ชื่อ</th>
          <th>คะแนน</th>
        </tr>
      </thead>
      <tbody>
      ${generateStudents(grade,room)}
      </tbody>
    `;

    card.appendChild(table);
    container.appendChild(card);
  }
}

function generateStudents(g,r){
  let rows="";
  for(let i=1;i<=25;i++){
    rows += `<tr>
      <td>นักเรียน ม${g}/${r} เลขที่ ${i}</td>
      <td>${Math.floor(Math.random()*41)+60}</td>
    </tr>`;
  }
  return rows;
}
</script>

</div>

<script src="script.js"></script>
</body>
</html>
