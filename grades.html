<script>

/* menu */

function toggleMenu(){
document.getElementById("menu").classList.toggle("active")
}

document.addEventListener("click",function(e){
if(!e.target.closest(".sidebar") && !e.target.closest(".menu-btn")){
document.getElementById("menu").classList.remove("active")
}
})

/* dark mode */

function toggleDark(){
document.body.classList.toggle("dark")
}

/* student system */

let students = JSON.parse(localStorage.getItem("students"))

/* ถ้ายังไม่มีข้อมูล ให้สร้างนักเรียนอัตโนมัติ */

if(!students){

students = []

for(let level=1; level<=6; level++){

for(let room=1; room<=30; room++){

for(let num=1; num<=25; num++){

students.push({
level:"ม."+level,
room:room,
name:"นักเรียน ม"+level+"/"+room+"-"+num,
grade:"0"
})

}

}

}

localStorage.setItem("students",JSON.stringify(students))

}

function renderStudents(){

let body = document.getElementById("tableBody")

body.innerHTML=""

students.forEach((s,i)=>{

body.innerHTML += `
<tr>
<td>${s.level}</td>
<td>${s.room}</td>
<td>${s.name}</td>
<td contenteditable="true" onblur="updateGrade(${i},this.innerText)">${s.grade}</td>
<td><button onclick="deleteStudent(${i})">ลบ</button></td>
</tr>
`

})

localStorage.setItem("students",JSON.stringify(students))

}

function addStudent(){

let level=document.getElementById("gradeLevel").value
let room=document.getElementById("room").value
let name=document.getElementById("name").value
let grade=document.getElementById("grade").value

students.push({level,room,name,grade})

renderStudents()

}

function deleteStudent(i){

students.splice(i,1)

renderStudents()

}

function updateGrade(i,val){

students[i].grade = val

localStorage.setItem("students",JSON.stringify(students))

}

/* search */

function searchStudent(){

let input=document.getElementById("searchInput").value.toLowerCase()

let rows=document.querySelectorAll("#studentTable tbody tr")

rows.forEach(r=>{

let name=r.children[2].innerText.toLowerCase()

r.style.display = name.includes(input) ? "" : "none"

})

}

/* chat */

let chat = JSON.parse(localStorage.getItem("chat")) || []

function renderChat(){

let box=document.getElementById("chatBox")

box.innerHTML=""

chat.forEach(m=>{
box.innerHTML += "<div>"+m+"</div>"
})

box.scrollTop = box.scrollHeight

}

function sendChat(){

let input=document.getElementById("chatInput")

if(input.value.trim()!=""){

chat.push(input.value)

localStorage.setItem("chat",JSON.stringify(chat))

input.value=""

renderChat()

}

}

renderStudents()
renderChat()

</script>
